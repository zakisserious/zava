[package]
name = "zava"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Console-based audio visualizer — a pure-Rust remake of CAVA"
license = "MIT"
readme = "README.md"
keywords = ["audio", "visualizer", "cava", "tui", "spectrum"]
categories = ["command-line-utilities", "multimedia::audio"]
# TODO(authors): fill in your name/email and the repository URL before publishing.
# authors = ["Your Name <you@example.com>"]
# repository = "https://github.com/<you>/zava"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
rustfft = "6.4.1"
signal-hook = "0.4.4"
# cpal pulls in an ALSA build; gated behind a feature for default builds.
cpal = { version = "0.18.2", optional = true }

[features]
default = []
cpal = ["dep:cpal"]

# Shipped in released binaries so the visualizer path is as cheap as possible.
[profile.release]
lto = true
codegen-units = 1
strip = true
