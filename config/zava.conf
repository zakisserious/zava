# ============================================================
#  ZAVA CONFIG — ~/.config/zava/config
#  Every option listed, with accepted values as comments.
#  Lines starting with # or ; are ignored. Inline comments
#  after a value (using # or ;) are also allowed.
#
#  Copy to ~/.config/zava/config (or run `zava --generate-config`).
#  Zava never reads ~/.config/cava/config: it is config-isolated so it
#  cannot rewrite your CAVA setup.
# ============================================================

# ------------------------------------------------------------
# [general] — core visualizer behaviour
# ------------------------------------------------------------
[general]
framerate = 60                 # frames per second (higher = smoother, more CPU)
autosens = 1                   # 0|1 — auto sensitivity: normalizes bars to full height
sensitivity = 100.0            # manual gain, 100 = unity. Up/Down keys x1.15 / x0.85
scaling = linear               # linear | log | sqrt | cbrt — amplitude→height curve
bars = 0                       # 0 = auto-fit to terminal width; N = fixed bar count
bar_width = 2                  # 1..64 — glyph width of each bar
bar_spacing = 1                # 0..  — blank columns between bars. With 0 the bars
                               #   touch and the 1/8-row quantization shows as a
                               #   pixel staircase; consider monstercat > 0 (below)
                               #   to smooth the contour.
bar_height = 32                # vertical resolution in sub-character rows
center_align = true            # 0|1 — center the bar block horizontally
wrap_bars = false              # 0|1 — Left/Right at the end of their range jump to
                               #   the opposite end. 0 (default) stops at the limit,
                               #   which matches CAVA and keeps the key predictable.
max_height = 100               # 0..100 — cap bar height as % of terminal height
lower_cutoff_freq = 50         # Hz — low edge of the FFT band range
higher_cutoff_freq = 10000     # Hz — high edge (must be < sample_rate/2)
sleep_timer = 0                # seconds; 0 = run forever, else quit after N s
live_config = false            # 0|1 — hot-reload this file every 500 ms

# ------------------------------------------------------------
# [input] — where the audio comes from
# ------------------------------------------------------------
[input]
method = pipewire              # pipewire | pulse | alsa | fifo | cpal (aka portaudio|coreaudio) | test
source = auto                  # device string; "auto" = default monitor. For fifo: a path
sample_rate = 44100            # Hz — sample rate of the input stream
sample_bits = 16               # 8 | 16 | 24 | 32 — sample width
channels = 2                   # 1 | 2 — channels of the INPUT stream (clamped to 1..2)
autoconnect = 2                # 0|1|2 — connect/retry policy for the audio backend

# ------------------------------------------------------------
# [output] — how bars are drawn and laid out
# ------------------------------------------------------------
[output]
method = noncurses             # noncurses (ANSI) | ncurses | raw (data stream)
                               #   `raw` writes binary data instead of drawing;
                               #   it is ignored (with a warning) when stdout is
                               #   a terminal, and is not offered in the menu.
orientation = bottom           # bottom | top | left | right | horizontal
                               #   bottom    bars grow up from the bottom edge
                               #   top       bars grow down from the top edge
                               #   left      bars grow right, from the left edge
                               #   right     bars grow left, from the right edge
                               #   horizontal  mirrored: bars grow up AND down
                               #               from a centre line
                               # Cycle live with the 'o' key.
channels = 2                   # mono | 1  OR  stereo | 2 — stereo draws TWO halves
mono_option = average          # left | right | average — 2ch→1ch mix (mono only)
reverse = false                # 0|1 — stereo layout: [Low…High | High…Low]
split_stereo = false           # 0|1 — stereo layout: [Low…High | Low…High] (checked BEFORE reverse)
                               #   both false → default mirrored [High…Low | Low…High] (bass in centre)
left_bottom = true             # 0|1 — which half is treated as "left"
raw_target = /dev/stdout       # where raw/ascii data is written (raw method only)
data_format = binary           # binary | ascii (raw method only)
bit_format = 16bit             # 16bit | 8bit (raw + binary only)
ascii_max_range = 1000         # max value for ascii output (raw + ascii only)
bar_delimiter = 59             # char code separating bars in ascii output (59 = ';')
frame_delimiter = 10           # char code separating frames (10 = '\n')
xaxis = none                   # none | scale — draw an axis scale under the bars
show_idle_bar_heads = true     # 0|1 — show the minimum glyph on silent bars
draw_peaks = false             # 0|1 — falling peak markers
peak_decay = 0.1               # how fast the peak markers fall
waveform = false               # 0|1 — oscilloscope waveform instead of spectrum bars

# ------------------------------------------------------------
# [color] — appearance
# ------------------------------------------------------------
[color]
background = #000000           # hex #rrggbb OR named: black red green yellow blue magenta cyan white
foreground = #ffffff           # same formats as background
gradient = false               # 0|1 — vertical colour gradient across bar height
gradient_count = 8             # 1..8 — number of gradient stops
gradient_color_1 = #59cc33     # stop 1 (bottom) … gradient_color_8 = top
gradient_color_2 = #80cc33
gradient_color_3 = #a6cc33
gradient_color_4 = #cccc33
gradient_color_5 = #cca633
gradient_color_6 = #cc8033
gradient_color_7 = #cc5933
gradient_color_8 = #cc3333
horizontal_gradient = false    # 0|1 — gradient ACROSS the bars (left→right)
horizontal_gradient_count = 8  # 1..8
horizontal_gradient_color_1 = #c45161   # stop 1 (left) … 8 (right)
horizontal_gradient_color_2 = #e094a0
horizontal_gradient_color_3 = #f2b6c0
horizontal_gradient_color_4 = #f2dde1
horizontal_gradient_color_5 = #cbc7d8
horizontal_gradient_color_6 = #8db7d2
horizontal_gradient_color_7 = #5e62a9
horizontal_gradient_color_8 = #434279
blend_direction = up           # up | down | left | right — gradient blend direction
theme = none                   # theme name; "none" uses the explicit colors above

# ------------------------------------------------------------
# [smoothing] — motion smoothing / decay
# ------------------------------------------------------------
[smoothing]
monstercat = 0.0               # float; 0 = off. Smooths BETWEEN neighbouring bars:
                               #   each bar's peak bleeds into its neighbours, decaying
                               #   geometrically with distance. Higher = tighter, spikier
                               #   bleed; lower (>0) = wider, rounder hills. ~1.5-3.0 is
                               #   typical. Especially useful when bar_spacing = 0: it
                               #   turns the quantized staircase into a smooth curve.
waves = false                  # 0|1 — wave-style smoothing
noise_reduction = 77           # 0..100 — temporal smoothing (higher = calmer)
gravity = 100.0                # 100 = default; higher = bars fall faster

# ------------------------------------------------------------
# [eq] — per-band gain. RAW LINEAR MULTIPLIERS, NOT decibels
#        (CAVA semantics: 1.0 = unity, 0.8 = −20%, 1.2 = +20%)
#        Staircase-distributed across bars; negatives clamped to 0.
# ------------------------------------------------------------
[eq]
# 1 = 0.8
# 2 = 0.9
# 3 = 1.0
# 4 = 1.1
# 5 = 1.2
